services:
  web:
    # ATENÇÃO (Windows): `docker compose build` falha com "invalid file request
    # src/app/[locale]/(site)/page.tsx" (bug do BuildKit com colchetes/parênteses
    # no caminho). Builde com `scripts\docker-build.cmd` (contexto via tar/stdin)
    # e suba com `docker compose up -d --no-build web`.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Teste local: nunca enviar hits reais ao Mautic (flag é build-time).
        - NEXT_PUBLIC_MAUTIC_TRACKING_ENABLED=${NEXT_PUBLIC_MAUTIC_TRACKING_ENABLED:-false}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: site-roco:latest
    container_name: site-roco
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Dentro da rede do compose os hosts são os nomes dos serviços.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-roco}:${POSTGRES_PASSWORD:-roco}@postgres:5432/${POSTGRES_DB:-roco_portal}
      - REDIS_URL=redis://redis:6379
      - AUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Banco do Portal/CRM (Auth.js, RBAC, catálogo, representantes). Ver
  # memory-bank/decisionLog.md 2026-08-09 ("Persistência: PostgreSQL + Drizzle ORM").
  postgres:
    image: postgres:17-alpine
    container_name: site-roco-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-roco}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-roco}
      - POSTGRES_DB=${POSTGRES_DB:-roco_portal}
    volumes:
      - roco_postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 → evita conflito com o Postgres de outros projetos em 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roco} -d ${POSTGRES_DB:-roco_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Fila BullMQ (sync ERP) e cache de sessão. Ver decisionLog 2026-08-09
  # ("Sync ERP: fila assíncrona BullMQ + Redis, worker in-process").
  redis:
    image: redis:8-alpine
    container_name: site-roco-redis
    ports:
      # Host 6380 → evita conflito com o Redis de outros projetos em 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  roco_postgres_data:
